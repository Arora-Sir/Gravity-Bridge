name: Track Traffic

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update traffic history and badges
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: python .github/scripts/track_traffic.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/traffic-history.json .github/badges/
          git diff --cached --quiet || git commit -m "chore: update traffic stats"
          git push
