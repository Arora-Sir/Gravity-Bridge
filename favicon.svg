<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="60%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>
    
    <!-- Central Core Levitation Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Gold/Amber Planet Gradient -->
    <linearGradient id="planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Premium Dark Circular Base -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  
  <!-- Subtle Outer Border Rim -->
  <circle cx="32" cy="32" r="31.2" fill="none" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>

  <!-- levitation magnetic waves (Antigravity Logo) -->
  <path d="M18 26 C26 21, 38 21, 46 26" fill="none" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
  <path d="M14 22 C24 16, 40 16, 50 22" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.2"/>

  <!-- Glowing Anti-Gravity Center -->
  <circle cx="32" cy="24" r="18" fill="url(#glow)"/>

  <!-- Glowing Core Planet (Floating) -->
  <circle cx="32" cy="23" r="6.5" fill="url(#planet)"/>
  <!-- Planet Highlight Spot -->
  <circle cx="30" cy="21.2" r="2.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="29.2" cy="20.4" r="0.8" fill="#ffffff" opacity="0.7"/>

  <!-- Left Node: Laptop (Representing Computer) -->
  <g transform="translate(10, 38)" opacity="0.9">
    <!-- Laptop screen -->
    <rect x="0" y="0" width="10" height="7" rx="1.5" fill="#d97706"/>
    <!-- Laptop keyboard/base -->
    <polygon points="-2,7 12,7 11,9 -1,9" fill="#f59e0b"/>
    <!-- Glowing indicator -->
    <circle cx="5" cy="8.2" r="0.5" fill="#fef08a"/>
  </g>

  <!-- Right Node: Phone (Representing Device) -->
  <g transform="translate(44, 35)" opacity="0.9">
    <!-- Phone body -->
    <rect x="0" y="0" width="8" height="13" rx="2" fill="#d97706"/>
    <!-- Screen overlay -->
    <rect x="1" y="1.2" width="6" height="9.5" rx="1" fill="#11131c"/>
    <!-- Home button / indicator -->
    <circle cx="4" cy="11.8" r="0.6" fill="#f59e0b"/>
  </g>

  <!-- The Bridge (Sleek glowing gravity connection arc) -->
  <!-- Sweeps from laptop node to phone node -->
  <path d="M15 42 Q32 30, 48 41" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" filter="drop-shadow(0 0 3px #d97706)"/>
  <!-- Inner gravity flow line -->
  <path d="M15 42 Q32 30, 48 41" fill="none" stroke="#fef08a" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Orbiting gravity particle ring tilted -->
  <ellipse cx="32" cy="23" rx="16" ry="5.5" fill="none" stroke="#fbbf24" stroke-width="0.9" stroke-dasharray="6 4" opacity="0.65" transform="rotate(-15 32 23)"/>
</svg>
